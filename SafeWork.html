<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SafeWork</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f2;--card:#fff;--ink:#14212e;--mut:#5d6b78;--line:#d8dde2;--y:#ffc20e;--nav:#14212e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--card:#18232f;--ink:#e8edf1;--mut:#93a1ae;--line:#2b3947;--nav:#0a1118}}
:root[data-theme=dark]{--bg:#0f1720;--card:#18232f;--ink:#e8edf1;--mut:#93a1ae;--line:#2b3947;--nav:#0a1118}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:560px;margin:auto;padding:0 16px 96px}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 12px,#14212e 12px 24px);margin:0 -16px 14px}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:.4em 0 .3em;line-height:1.1}
h1{font-size:44px}h2{font-size:28px}h3{font-size:20px}
.mut{color:var(--mut)}.err{color:#d33;min-height:1.2em;margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
label{display:block;font-weight:600;margin:0 0 10px}
input,select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px}
.btn{width:100%;padding:12px;border:0;border-radius:8px;background:var(--y);color:#14212e;font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.03em;cursor:pointer}
.btn.s{width:auto;padding:8px 14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:600;color:#fff;background:var(--c)}
.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{padding:16px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 16px Barlow,sans-serif;text-align:left;cursor:pointer}
.act b{display:block;font-size:26px}
.act.big{grid-column:1/-1;background:var(--y);color:#14212e;border:0}
.kpi{text-align:center;padding:10px 4px;border-radius:8px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c)}
.kpi b{display:block;font:700 30px 'Barlow Condensed',sans-serif}.kpi span{font-size:12px}
.k5{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:110px 1fr 24px;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar i{display:block;height:12px;border-radius:3px;background:var(--y)}.bar b{text-align:right}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.banner{padding:12px;border-radius:10px;margin-bottom:12px;font-weight:600;background:var(--c);color:#fff}
.hist{font-size:14px;color:var(--mut);margin:8px 0 0;padding-left:16px}
.sug{margin:-4px 0 10px;font-size:14px}
.yn{display:flex;gap:8px}.yn label{flex:1;margin:0}.yn input{display:none}
.yn span{display:block;text-align:center;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.yn input:checked+span{background:#14212e;color:#fff;border-color:#14212e}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:10px 2px;border:0;background:none;color:#aab6c1;font:500 12px Barlow,sans-serif;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--y);border-top-color:var(--y)}nav b{display:block;font-size:20px}
.toast{position:fixed;left:16px;right:16px;bottom:88px;max-width:520px;margin:auto;padding:12px;border-radius:10px;background:#14212e;color:#fff;border-left:6px solid var(--y);z-index:9}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['Aberta','Em análise','Em correção','Resolvida','Encerrada'],SC=['#d33','#c79400','#e8790c','#1f9d55','#555'];
const TIPOS=['Mecânico','Elétrico','Químico','Físico','Ergonômico','Incêndio','Queda','Falha de equipamento','Outro'];
const SET=['Produção','Manutenção','Estoque','Logística','Administrativo','Laboratório'],GR=['Baixa','Média','Alta'];
const PF={f:'Funcionário',s:'Supervisor',a:'Administrador'};
const U=[{id:'joao',nome:'João Silva',p:'f',setor:'Produção'},{id:'ana',nome:'Ana Lima',p:'f',setor:'Manutenção'},{id:'maria',nome:'Maria Souza',p:'s',setor:'Segurança'},{id:'admin',nome:'Administrador',p:'a',setor:'Administrativo'}];
const dd=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},days=s=>Math.round((new Date(s)-new Date())/864e5)+1;
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ago=h=>new Date(Date.now()-h*36e5).toISOString();
const mk=(id,uid,tipo,setor,local,desc,gr,st,h)=>({id,uid,tipo,setor,local,desc,gr,st,foto:'',hist:Array.from({length:st+1},(_,i)=>[i,ago(h-i*2),i?'Maria Souza':U.find(u=>u.id==uid).nome])});
const D={
 epis:{joao:[['Capacete',dd(450)],['Óculos',dd(300)],['Luvas',dd(25)],['Protetor auricular',dd(240)]],ana:[['Capacete',dd(380)],['Luvas',dd(200)],['Botina',dd(40)]]},
 trs:{joao:[['Segurança do trabalho',dd(200)],['Primeiros socorros',dd(120)],['Segurança elétrica',null],['Combate a incêndio',dd(12)]],ana:[['Segurança do trabalho',dd(150)],['Segurança elétrica',dd(90)]]},
 chk:[{uid:'ana',dia:dd(0),risco:false}],
 occs:[mk(1,'joao','Elétrico','Produção','Máquina 04','Cabo exposto na área de circulação',2,0,3),mk(2,'ana','Elétrico','Produção','Máquina 04','Tomada com fio descascado',2,1,40),mk(3,'joao','Elétrico','Produção','Máquina 02','Fiação solta atrás do painel',1,0,90),mk(4,'ana','Queda','Manutenção','Corredor B','Óleo no chão perto da bancada',1,2,60),mk(5,'joao','Ergonômico','Estoque','Prateleira 3','Caixas pesadas acima da altura do ombro',0,3,120)]
};
let S={u:null,v:'home',open:null,fl:'',sg:null};
function pr(o){const f=D.occs.filter(x=>x.id!=o.id&&x.tipo==o.tipo&&x.setor==o.setor&&x.st<3).length,s=o.gr+1+Math.min(f,2);return s>=5?['Crítica','#d33',s]:s==4?['Alta','#e8790c',s]:s==3?['Média','#c79400',s]:['Baixa','#1f9d55',s]}
const pill=(t,c)=>`<span class=pill style="--c:${c}">${t}</span>`;
const epiS=v=>{const n=days(v);return n<0?['Vencido','#d33']:n<=60?['Troca próxima','#e8790c']:['Entregue','#1f9d55']};
const trS=v=>{if(!v)return['Pendente','#d33'];const n=days(v);return n<=30?[`Vence em ${n} dias`,'#e8790c']:['Em dia','#1f9d55']};
const emps=()=>U.filter(u=>u.p=='f'),done=uid=>D.chk.some(c=>c.uid==uid&&c.dia==dd(0));
const RULES=[[/óleo|escorreg|degrau|piso|molhado|queda/i,'Queda',2],[/cabo|fio|choque|elétric|tomada|fiação/i,'Elétrico',2],[/fogo|fumaça|incêndio|extintor/i,'Incêndio',2],[/químic|vazamento|gás|produto/i,'Químico',1],[/máquina|proteção|equipamento|peça/i,'Falha de equipamento',1],[/peso|postura|repetitiv|ombro/i,'Ergonômico',1],[/ruído|barulho|calor|temperatura/i,'Físico',1]];
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
const opt=(a,s)=>a.map(x=>`<option${x==s?' selected':''}>${x}</option>`).join('');
function R(){$('#app').innerHTML=S.u?shell():login()}
function go(v){S.v=v;S.open=null;R();scrollTo(0,0)}
function login(){return `<div class=wrap><div class=stripe></div><h1>SafeWork</h1><p class=mut>Registre riscos, faça o checklist e acompanhe a segurança da sua equipe.</p><div class=card><label>Usuário<input id=lu value=joao autocapitalize=off></label><label>Senha<input id=lp type=password value=1234></label><p id=le class=err></p><button class=btn onclick=doLogin()>ENTRAR</button></div><p class=mut>Contas de teste (senha 1234):</p><div class=chips>${U.map(u=>`<button class=chip onclick="$('#lu').value='${u.id}'">${u.nome} (${PF[u.p]})</button>`).join('')}</div></div>`}
function doLogin(){const u=U.find(x=>x.id==$('#lu').value.trim().toLowerCase());if(!u||$('#lp').value!='1234'){$('#le').textContent='Usuário ou senha incorretos.';return}S.u=u;S.v=u.p=='f'?'home':'dash';R()}
function shell(){const f=S.u.p=='f',N=f?[['home','🏠','Início'],['risk','🚨','Risco'],['chk','📋','Checklist'],['epi','🦺','EPIs'],['mine','📜','Minhas']]:[['dash','📊','Painel'],['occ','🚨','Ocorrências'],['team','👷','Equipe'],['alr','🔔','Alertas']];
return `<div class=wrap><div class=stripe></div><div class=top><h3>SafeWork</h3><button class=chip onclick="S.u=null;R()">Sair</button></div>${V[S.v]()}</div><nav>${N.map(n=>`<button class="${S.v==n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav>`}
function occCard(o,mgr){const p=pr(o),op=S.open==o.id;return `<div class=card><div onclick="S.open=${op?0:o.id};R()" style="cursor:pointer"><div class=top><b>${o.tipo}: ${esc(o.local)}</b>${pill(ST[o.st],SC[o.st])}</div><div class=mut>${o.setor} · ${fmt(o.hist[0][1])} · ${U.find(u=>u.id==o.uid).nome}</div><p style="margin:6px 0">${esc(o.desc)}</p>${pill('Prioridade '+p[0],p[1])} ${pill('Gravidade '+GR[o.gr],'#5d6b78')}</div>${o.foto?`<img src="${o.foto}" alt="Foto do risco" style="max-width:100%;border-radius:8px;margin-top:8px">`:''}${op?`<ul class=hist>${o.hist.map(h=>`<li>${ST[h[0]]} — ${fmt(h[1])} por ${h[2]}</li>`).join('')}</ul>`:''}${mgr&&o.st<4?`<p style="margin:10px 0 0"><button class="btn s" onclick="adv(${o.id})">${o.st==0?'Assumir ocorrência':'Marcar como '+ST[o.st+1].toLowerCase()}</button></p>`:''}</div>`}
function adv(id){const o=D.occs.find(x=>x.id==id);o.st++;o.hist.push([o.st,new Date().toISOString(),S.u.nome]);toast('Status: '+ST[o.st]);R()}
function sug(){const t=$('#fd').value,r=RULES.find(x=>x[0].test(t));S.sg=r;$('#sg').innerHTML=r?`<div class=sug>💡 Sugestão: <b>${r[1]}</b>, gravidade ${GR[r[2]]} <button class="chip" onclick="useSug()">Usar</button></div>`:''}
function useSug(){$('#ft').value=S.sg[1];$('#fg').value=S.sg[2]}
function send(){const d=$('#fd').value.trim(),l=$('#fl').value.trim();if(!d||!l){toast('Preencha a descrição e o local.');return}const fp=$('#fp').files[0],id=Math.max(...D.occs.map(o=>o.id))+1,o=mk(id,S.u.id,$('#ft').value,$('#fs').value,l,d,+$('#fg').value,0,0);o.hist=[[0,new Date().toISOString(),S.u.nome]];o.foto=fp?URL.createObjectURL(fp):'';D.occs.push(o);toast(`🚨 Alerta enviado: ${o.tipo}, ${o.setor}, gravidade ${GR[o.gr]}`);go('mine')}
function saveChk(){const q=[0,1,2,3].map(i=>{const e=document.querySelector(`input[name=c${i}]:checked`);return e?e.value:null});if(q.includes(null)){toast('Responda todas as perguntas.');return}const risco=q[3]=='1';D.chk.push({uid:S.u.id,dia:dd(0),risco});if(risco){toast('Checklist salvo. Descreva a situação de risco.');go('risk')}else{toast('✅ Checklist concluído');go('home')}}
const V={
home(){const u=S.u,ok=done(u.id),pend=(D.epis[u.id]||[]).some(e=>epiS(e[1])[0]!='Entregue')||(D.trs[u.id]||[]).some(t=>trS(t[1])[0]!='Em dia'),g=ok&&!pend;
return `<h2>Olá, ${u.nome.split(' ')[0]}!</h2><div class=banner style="--c:${g?'#1f9d55':'#c79400'}">${g?'🟢 Segurança atualizada':'⚠️ Você tem pendências'}${ok?'':'<br><small>Checklist de hoje ainda não feito</small>'}</div><div class=grid><button class="act big" onclick="go('risk')"><b>🚨</b>Registrar risco</button><button class=act onclick="go('chk')"><b>📋</b>Fazer checklist</button><button class=act onclick="go('epi')"><b>🦺</b>Meus EPIs e treinamentos</button><button class=act onclick="go('mine')"><b>📜</b>Minhas ocorrências</button></div>`},
risk(){return `<h2>Registrar risco</h2><div class=card><label>O que você encontrou?<textarea id=fd oninput=sug() placeholder="Ex.: óleo vazando perto da máquina"></textarea></label><div id=sg></div><label>Tipo de risco<select id=ft>${opt(TIPOS)}</select></label><label>Setor<select id=fs>${opt(SET,S.u.setor)}</select></label><label>Local<input id=fl placeholder="Ex.: Máquina 04"></label><label>Gravidade<select id=fg><option value=0>Baixa</option><option value=1>Média</option><option value=2>Alta</option></select></label><label>Foto (opcional)<input type=file accept="image/*" id=fp></label><button class=btn onclick=send()>ENVIAR ALERTA</button></div>`},
chk(){if(done(S.u.id))return `<h2>Checklist diário</h2><div class=banner style="--c:#1f9d55">✅ Checklist de hoje concluído.</div>`;const Q=['EPIs adequados?','Área de trabalho segura?','Equipamentos funcionando corretamente?','Existe alguma situação de risco?'];
return `<h2>Checklist diário</h2>${Q.map((q,i)=>`<div class=card><b>${q}</b><div class=yn style="margin-top:8px"><label><input type=radio name=c${i} value=1><span>Sim</span></label><label><input type=radio name=c${i} value=0><span>Não</span></label></div></div>`).join('')}<button class=btn onclick=saveChk()>SALVAR CHECKLIST</button>`},
epi(){const u=S.u.id;return `<h2>Meus EPIs</h2><div class=card>${(D.epis[u]||[]).map(e=>{const s=epiS(e[1]);return `<div class=row><span>${e[0]}<br><small class=mut>Validade ${e[1].split('-').reverse().slice(1).join('/')}</small></span>${pill(s[0],s[1])}</div>`}).join('')||'Nenhum EPI registrado.'}</div><h2>Meus treinamentos</h2><div class=card>${(D.trs[u]||[]).map(t=>{const s=trS(t[1]);return `<div class=row><span>${t[0]}</span>${pill(s[0],s[1])}</div>`}).join('')}</div>`},
mine(){const l=D.occs.filter(o=>o.uid==S.u.id).reverse();return `<h2>Minhas ocorrências</h2>${l.map(o=>occCard(o,0)).join('')||'<p class=mut>Você ainda não registrou nenhum risco.</p>'}`},
dash(){const O=D.occs,by=(a,f)=>a.map(k=>[k,O.filter(o=>f(o)==k).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),bars=a=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class=bar><span>${x[0]}</span><i style="width:${x[1]/m*100}%"></i><b>${x[1]}</b></div>`).join('')};
const E=emps(),tp=E.reduce((n,u)=>n+(D.trs[u.id]||[]).filter(t=>trS(t[1])[0]!='Em dia').length,0),ep=E.reduce((n,u)=>n+(D.epis[u.id]||[]).filter(e=>epiS(e[1])[0]!='Entregue').length,0);
return `<h2>Painel de segurança</h2><div class=k5><div class=kpi style="--c:#14212e"><b>${O.length}</b><span>Total</span></div>${ST.slice(0,4).map((s,i)=>`<div class=kpi style="--c:${SC[i]}"><b>${O.filter(o=>o.st==i).length}</b><span>${s}</span></div>`).join('')}</div><div class=card><h3>Riscos por categoria</h3>${bars(by(TIPOS,o=>o.tipo))}</div><div class=card><h3>Riscos por setor</h3>${bars(by(SET,o=>o.setor))}</div><div class=card><h3>Riscos por gravidade</h3>${bars(by(GR,o=>GR[o.gr]))}</div><div class=card><h3>Funcionários</h3><div class=row><span>Treinamentos pendentes ou vencendo</span><b>${tp}</b></div><div class=row><span>EPIs próximos da validade</span><b>${ep}</b></div><div class=row><span>Checklists feitos hoje</span><b>${E.filter(u=>done(u.id)).length} de ${E.length}</b></div></div>`},
occ(){const l=[...D.occs].filter(o=>!S.fl||o.st==S.fl).sort((a,b)=>pr(b)[2]-pr(a)[2]||b.id-a.id);return `<h2>Ocorrências</h2><label>Filtrar por status<select onchange="S.fl=this.value;R()"><option value="">Todos</option>${ST.map((s,i)=>`<option value=${i}${S.fl==i&&S.fl!==''?' selected':''}>${s}</option>`).join('')}</select></label>${l.map(o=>occCard(o,1)).join('')||'<p class=mut>Nenhuma ocorrência neste status.</p>'}`},
team(){return `<h2>Equipe</h2>${emps().map(u=>`<div class=card><div class=top><b>${u.nome}</b>${pill(done(u.id)?'Checklist feito':'Checklist pendente',done(u.id)?'#1f9d55':'#d33')}</div><div class=mut>${u.setor}</div>${(D.epis[u.id]||[]).map(e=>{const s=epiS(e[1]);return `<div class=row><span>🦺 ${e[0]}</span>${pill(s[0],s[1])}</div>`}).join('')}${(D.trs[u.id]||[]).map(t=>{const s=trS(t[1]);return `<div class=row><span>🎓 ${t[0]}</span>${pill(s[0],s[1])}</div>`}).join('')}</div>`).join('')}`},
alr(){const E=emps(),cr=D.occs.filter(o=>pr(o)[0]=='Crítica'&&o.st<2).length,tp=E.reduce((n,u)=>n+(D.trs[u.id]||[]).filter(t=>trS(t[1])[0]!='Em dia').length,0),ep=E.reduce((n,u)=>n+(D.epis[u.id]||[]).filter(e=>epiS(e[1])[0]!='Entregue').length,0),ck=E.filter(u=>!done(u.id)).length,ab=D.occs.filter(o=>o.st==0).length;
const A=[[cr,'🔴',`${cr} risco(s) crítico(s) aguardando análise`],[ab,'🚨',`${ab} ocorrência(s) aberta(s) sem responsável`],[tp,'🎓',`${tp} treinamento(s) pendente(s) ou vencendo`],[ep,'🦺',`${ep} EPI(s) próximo(s) da validade`],[ck,'📋',`${ck} checklist(s) não realizado(s) hoje`]].filter(a=>a[0]);
return `<h2>Central de alertas</h2>${A.map(a=>`<div class=card>${a[1]} ${a[2]}</div>`).join('')||'<p class=mut>Tudo em dia.</p>'}`}};
R();
</script></body></html>
